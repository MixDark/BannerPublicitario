    INSTRUCCIONES DE MÚSICA:
    1. Coloca tu archivo MP3 en la misma carpeta con el nombre: music.mp3
    2. El navegador intentará reproducirlo automáticamente al abrir la página.
    3. Si el navegador bloquea el autoplay (Chrome/Edge lo hacen por política),
       el botón pulsará para invitar al usuario a activarlo con un clic.
  -->
